name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm verify:migrations
      - run: pnpm build
      - name: Production health smoke test
        if: github.ref == 'refs/heads/main'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://secret-iota-ten.vercel.app/api/health
